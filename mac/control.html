<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:">
  <title>دوال دسک اوج | OWJ Dual Desk</title>
  <link rel="stylesheet" href="control.css">
  <link rel="stylesheet" href="control-pages.css">
  <link rel="stylesheet" href="../shared/phonehub.css">
  <link rel="stylesheet" href="../shared/kvm-map-ui.css">
  <link rel="stylesheet" href="../shared/updater.css">
  <link rel="stylesheet" href="../shared/ui-device.css">
  <link rel="stylesheet" href="../shared/aurora.css">
  <link rel="stylesheet" href="../shared/aurora-pages.css">
  <link rel="stylesheet" href="../shared/aurora-shell.css">
  <link rel="stylesheet" href="../shared/pagefx/core.css">
  <link rel="stylesheet" href="../shared/pagefx/home.css">
  <link rel="stylesheet" href="../shared/pagefx/screens.css">
  <link rel="stylesheet" href="../shared/pagefx/input.css">

  <link rel="stylesheet" href="../shared/pagefx/support.css">

</head>
<body>
  <nav id="sidebar" aria-label="Sections">
    <div class="owj-rtl identity">
      <div class="owj-rtl app-mark" aria-hidden="true"></div>
      <div class="owj-rtl who">
        <div class="owj-rtl app-name">DuoDesk</div>
        <div class="owj-rtl peer"><span id="peer-dot" class="owj-rtl dot"></span><span id="peer-text">Not connected</span></div>
      </div>
    </div>
    <div id="phones"></div>
    <ul id="nav" role="tablist"></ul>
  </nav>

  <main id="content">
    <div class="owj-rtl drag-strip" aria-hidden="true"></div>
    <section id="banner" class="owj-rtl banner" hidden>
      <div class="owj-rtl banner-text">
        <span id="pair-title"><strong id="pair-name"></strong> wants to pair</span>
        <span id="pair-code-label" class="owj-rtl code-label">Code</span> <span id="pair-code" class="owj-rtl code"></span>
        <div id="pair-hint" class="owj-rtl hint"></div>
      </div>
      <div class="owj-rtl banner-actions">
        <button id="pair-deny" class="owj-rtl btn">Deny</button>
        <button id="pair-allow" class="owj-rtl btn primary">Allow</button>
      </div>
    </section>
    <section id="net-banner" class="owj-rtl banner" hidden>
      <div class="owj-rtl banner-text">
        <span id="net-title"></span>
        <div id="net-hint" class="owj-rtl hint"></div>
        <div id="net-form" class="owj-rtl net-form" hidden>
          <input id="net-ssid" type="text" placeholder="Hotspot name" autocomplete="off" spellcheck="false" aria-label="Hotspot name">
          <input id="net-pass" type="password" placeholder="Password" autocomplete="off" aria-label="Hotspot password">
        </div>
      </div>
      <div class="owj-rtl banner-actions">
        <button id="net-cancel" class="owj-rtl btn">Cancel</button>
        <button id="net-join" class="owj-rtl btn primary">Join</button>
      </div>
    </section>
    <div id="pages"></div>
  </main>

  <script src="../shared/protocol.js"></script>
  <script src="control.js"></script>
  <script src="../shared/otp.js"></script>
  <script src="../shared/qr.js"></script>
  <script src="../shared/ui-nowplaying.js"></script>
  <script src="ui-overview.js"></script>
  <script src="ui-display.js"></script>
  <script src="ui-display-pc.js"></script>
  <script src="../shared/kvm-geom.js"></script>
  <script src="../shared/kvm-map-ui.js"></script>
  <script src="ui-cursor.js"></script>
  <script src="ui-keyboard.js"></script>
  <script src="ui-clipboard.js"></script>
  <script src="ui-audio.js"></script>
  <script src="../shared/ui-camera.js"></script>
  <script src="../shared/ui-remote.js"></script>
  <script src="ui-terminal.js"></script>
  <script src="ui-notifs.js"></script>
  <script src="ui-files.js"></script>
  <script src="ui-mount.js"></script>
  <script src="../shared/ui-rezume.js"></script>
  <script src="ui-apps.js"></script>
  <script src="../shared/ui-adbqr.js"></script>
  <script src="../shared/ui-adb.js"></script>
  <script src="../shared/ui-qrpair.js"></script>
  <script src="../shared/ui-device.js"></script>
  <script src="../shared/ui-mirror.js"></script>
  <script src="ui-general.js"></script>
  <script src="ui-about.js"></script>
  <script src="../shared/ui-support.js"></script>
  <script src="ui-setup.js"></script>
  <script src="../shared/feature-art.js"></script>
  <script src="../shared/mesh-intro.js"></script>
  <script src="ui-multi.js"></script>
  <script src="../shared/ui-hub.js"></script>
  <script src="../shared/ui-calls.js"></script>
  <script src="../shared/ui-messages.js"></script>
  <script src="../shared/ui-media.js"></script>
  <script src="../shared/ui-pfiles.js"></script>
  <script src="../shared/pairpop.js"></script>
  <script src="../shared/ui-updater-modal.js"></script>
  <script src="ui-start.js"></script>
  <script src="../shared/aurora-shell.js"></script>
  <script src="../shared/pagefx/core.js"></script>
  <script src="../shared/pagefx/home.js"></script>
  <script src="../shared/pagefx/screens.js"></script>
  <script src="../shared/pagefx/input.js"></script>
  <script src="../shared/pagefx/sharing.js"></script>
  <script src="../shared/pagefx/phone-media.js"></script>
  <script src="../shared/pagefx/support.js"></script>
  <script src="../shared/owj-fa.js"></script>
</body>
</html>
